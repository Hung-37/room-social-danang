{
  "name": "room-social-danang",
  "services": {
    "mysql": {
      "image": "mysql:8.4",
      "restart": "unless-stopped",
      "environment": {
        "MYSQL_DATABASE": "room_danang",
        "MYSQL_USER": "room",
        "MYSQL_PASSWORD": "${MYSQL_PASSWORD}",
        "MYSQL_ROOT_PASSWORD": "${MYSQL_ROOT_PASSWORD}"
      },
      "volumes": [
        "mysql-data:/var/lib/mysql"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u room -D room_danang -e \"SELECT 1\""
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "30s"
      }
    },
    "ollama": {
      "image": "ollama/ollama:latest",
      "restart": "unless-stopped",
      "volumes": [
        "ollama-data:/root/.ollama"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "ollama",
          "list"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30
      }
    },
    "model-init": {
      "image": "ollama/ollama:latest",
      "environment": {
        "OLLAMA_HOST": "http://ollama:11434"
      },
      "command": [
        "pull",
        "${OLLAMA_MODEL:-llama3.2:3b}"
      ],
      "depends_on": {
        "ollama": {
          "condition": "service_healthy"
        }
      }
    },
    "db-init": {
      "build": ".",
      "image": "room-social-danang:local",
      "command": [
        "node",
        "scripts/db/init.mjs"
      ],
      "environment": {
        "MYSQL_URL": "mysql://room:${MYSQL_PASSWORD:?Run npm run stack:setup}@mysql:3306/room_danang",
        "ADMIN_EMAIL": "${ADMIN_EMAIL}",
        "ADMIN_PASSWORD": "${ADMIN_PASSWORD}",
        "ADMIN_SESSION_SECRET": "${ADMIN_SESSION_SECRET}",
        "USER_SESSION_SECRET": "${USER_SESSION_SECRET}",
        "OLLAMA_BASE_URL": "http://ollama:11434",
        "OLLAMA_MODEL": "${OLLAMA_MODEL:-llama3.2:3b}",
        "COLLECTOR_USE_AI": "true",
        "MYSQL_POOL_LIMIT": "5"
      },
      "depends_on": {
        "mysql": {
          "condition": "service_healthy"
        }
      }
    },
    "web": {
      "build": ".",
      "image": "room-social-danang:local",
      "restart": "unless-stopped",
      "ports": [
        "127.0.0.1:${WEB_PORT:-3000}:3000"
      ],
      "environment": {
        "MYSQL_URL": "mysql://room:${MYSQL_PASSWORD:?Run npm run stack:setup}@mysql:3306/room_danang",
        "ADMIN_EMAIL": "${ADMIN_EMAIL}",
        "ADMIN_PASSWORD": "${ADMIN_PASSWORD}",
        "ADMIN_SESSION_SECRET": "${ADMIN_SESSION_SECRET}",
        "USER_SESSION_SECRET": "${USER_SESSION_SECRET}",
        "OLLAMA_BASE_URL": "http://ollama:11434",
        "OLLAMA_MODEL": "${OLLAMA_MODEL:-llama3.2:3b}",
        "COLLECTOR_USE_AI": "true",
        "MYSQL_POOL_LIMIT": "5"
      },
      "volumes": [
        "uploads:/app/data"
      ],
      "depends_on": {
        "db-init": {
          "condition": "service_completed_successfully"
        },
        "model-init": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 10,
        "start_period": "30s"
      }
    }
  },
  "volumes": {
    "mysql-data": {},
    "ollama-data": {},
    "uploads": {}
  }
}
